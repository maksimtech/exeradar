name: CodeQL
on:
  # Code scanning depends on repository settings as much as on the code, so
  # being able to re-run it without an empty commit is worth two lines. The
  # first run here failed because the repository was private and code scanning
  # was unavailable; nothing in the code had changed when it started passing.
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '30 1 * * 1'
permissions:
  contents: read
  security-events: write
  # Private repositories only: the CodeQL action reads the workflow run through
  # the API to attach the results, and without this it fails with "Resource not
  # accessible by integration". Public repositories do not need it.
  actions: read
jobs:
  analyze:
    # Named for the check context: the ruleset requires a name, and a job name
    # that says what it is survives better than the workflow name.
    name: CodeQL
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python
          # Python needs no build. The autobuild step the other Radars inherited
          # is superfluous here and is what failed on mailradar in September.
          build-mode: none
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:python"
