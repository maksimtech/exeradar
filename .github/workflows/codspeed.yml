name: CodSpeed
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    paths:
      - 'exeradar/**'
      - 'tests/**'
      - 'pyproject.toml'
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  benchmarks:
    name: Run benchmarks
    # The last job to move to ubuntu-26.04. It stayed on 24.04 when the rest
    # moved on 2026-10-02: CodSpeedHQ/action v5 failed there with
    # `##[error]Unsupported system` (patchradar, run 37063015887). CodSpeed's
    # runner and action v5.5.0 (2026-10-14) added Ubuntu 26.04 on x86_64 and
    # arm64: https://github.com/CodSpeedHQ/runner/releases/tag/v5.5.0
    #
    # A named image, never `ubuntu-latest`: that label moves on GitHub's
    # schedule, and a job that breaks then breaks on main at a moment nobody
    # picked (tests/test_runners.py).
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        # --group needs pip >= 25.1 to read PEP 735 [dependency-groups].
        # pytest-codspeed is installed here and only here: the test suite runs
        # on four Python versions and must not depend on a benchmark runner.
        run: |
          python -m pip install --upgrade pip
          pip install --group dev -e .  # NOSONAR
          pip install pytest-codspeed --only-binary :all:
      - name: Run benchmarks
        uses: CodSpeedHQ/action@v5
        with:
          mode: simulation
          run: pytest tests/benchmarks --codspeed
