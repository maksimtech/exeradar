name: CodSpeed
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # Lets CodSpeed trigger backtest runs to build the initial history.
  workflow_dispatch:
permissions:
  contents: read
  id-token: write   # OpenID Connect authentication with CodSpeed
jobs:
  benchmarks:
    name: Run benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        # --group needs pip >= 25.1 to read PEP 735 [dependency-groups]
        run: |
          python -m pip install --upgrade pip
          pip install --group dev -e .
      - name: Run benchmarks
        uses: CodSpeedHQ/action@v5
        with:
          mode: simulation
          run: pytest tests/benchmarks --codspeed
