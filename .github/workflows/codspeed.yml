name: CodSpeed
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    paths:
      - 'exeradar/**'
      - 'tests/**'
      - 'pyproject.toml'
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  benchmarks:
    name: Run benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        # --group needs pip >= 25.1 to read PEP 735 [dependency-groups].
        # pytest-codspeed is installed here and only here: the test suite runs
        # on four Python versions and must not depend on a benchmark runner.
        run: |
          python -m pip install --upgrade pip
          pip install --group dev -e .  # NOSONAR
          pip install pytest-codspeed --only-binary :all:
      - name: Run benchmarks
        uses: CodSpeedHQ/action@v5
        with:
          mode: simulation
          run: pytest tests/benchmarks --codspeed
