name: Docker Build Check
# Builds the image from the repository source and runs the smoke test without
# pushing anything. The release workflow, when it exists, will publish to
# Docker Hub including :latest, so there has to be a way to try a Dockerfile
# change out that does not publish one.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build image from source
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: exeradar:build-check
      - name: Smoke test
        run: docker run --rm -i --entrypoint python exeradar:build-check - < tests/docker/smoke.py
