name: Build and Push Docker Image
# The git tag is the trigger, the same one publish.yml and release.yml use.
#
# apkradar, cookieradar and mailradar cannot do that: their images install the
# package from the index inside the Dockerfile, so their docker.yml has to poll until
# the upload running beside it has propagated — patchradar's 2026.9.4 failed on a fixed
# `sleep 60` that raced with its own publish, and apkradar lost the same race fifteen
# seconds *after* a poll had succeeded, because the runner and the multi-platform build
# ask different edges of the index.
#
# patchradar stopped asking on 2026-10-04 and builds from the tag's source, as this one
# always has: there is nothing to wait for and no version to agree on with anyone. The
# other three have not moved yet.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Tag to rebuild (e.g. v2026.09.3)'
        required: true
permissions:
  contents: read
jobs:
  docker:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      # The tag being built, not the default branch. The image is built from this
      # checkout, so a dispatched rebuild of an older release has to stand on that
      # release's tag. It did not, and the smoke test below caught the result rather
      # than letting it publish — comparing the version in the image against the tag
      # and refusing — so nothing was ever mis-published. What it meant is that
      # rebuilding an older release could not work at all.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref }}
      - name: Extract version
        id: version
        env:
          RAW: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        # v-prefixed, as apkradar, mailradar and cookieradar publish. The tag on
        # the image reads the same as the tag in the repository. A release tag or
        # nothing: a newline in a dispatch input would have added outputs and image
        # tags of its own (#88).
        run: |
          VERSION="v${RAW#v}"
          if [[ ! "$VERSION" =~ ^v[0-9]+(\.[0-9]+)+$ ]]; then
            printf '::error::not a release tag: %q\n' "$RAW"
            exit 1
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Built once for this machine and run, before anything reaches the world.
      # :latest is what everyone pulling the image gets, so a verification that
      # happens after the push is an epitaph.
      # Before the first build, not only before the push: every build pulls the
      # base image, and an anonymous pull from a runner shares its rate limit
      # with every other anonymous pull from that address. On 2026-10-09 a day
      # of builds across the five Radar ended in 429 on python:*-slim.
      - name: Login to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build image for the smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: exeradar:smoke
      - name: Smoke test (the image runs, and it holds the version being tagged)
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: docker run --rm -i -e EXPECTED_VERSION="$VERSION" --entrypoint python exeradar:smoke - < tests/docker/smoke.py

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            maksimtech/exeradar:latest
            maksimtech/exeradar:${{ steps.version.outputs.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
