name: Build and Push Docker Image
# The git tag is the trigger, the same one publish.yml and release.yml use.
#
# The other four Radar cannot do that: their images install the package from the
# index inside the Dockerfile, so their docker.yml has to poll until the upload
# running beside it has propagated — patchradar's 2026.9.4 failed on a fixed
# `sleep 60` that raced with its own publish. This image installs the checkout,
# so there is nothing to wait for and no version to agree on with anyone.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Tag to rebuild (e.g. v2026.09.3)'
        required: true
permissions:
  contents: read
jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Extract version
        id: version
        env:
          RAW: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        # v-prefixed, as apkradar, mailradar and cookieradar publish. The tag on
        # the image reads the same as the tag in the repository.
        run: echo "VERSION=v${RAW#v}" >> "$GITHUB_OUTPUT"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Built once for this machine and run, before anything reaches the world.
      # :latest is what everyone pulling the image gets, so a verification that
      # happens after the push is an epitaph.
      - name: Build image for the smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: exeradar:smoke
      - name: Smoke test (the image runs, and it holds the version being tagged)
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: docker run --rm -i -e EXPECTED_VERSION="$VERSION" --entrypoint python exeradar:smoke - < tests/docker/smoke.py

      # Last, so the credentials are only in the job once there is something
      # worth pushing.
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            maksimtech/exeradar:latest
            maksimtech/exeradar:${{ steps.version.outputs.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
