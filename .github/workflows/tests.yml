name: Tests
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
permissions:
  contents: read
jobs:
  test:
    # The ruleset of main requires the stable rows under this name
    # (tests/test_codecov_contract.py).
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    # id-token: write lets the coverage upload prove to Codecov, through GitHub's
    # OIDC, which repository it comes from. Job permissions replace the workflow's,
    # so contents: read is repeated here.
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        # Keep in sync with the classifiers in pyproject.toml
        # (tests/test_codecov_contract.py checks that they match).
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
        experimental: [false]
        include:
          # The next Python, ahead of its final: 3.16.0 ships on 2027-10-06
          # (PEP 826). This row may fail without failing the suite; it is
          # here to learn early, it is never a required check, and it
          # becomes a stable row once the classifier does.
          - python-version: "3.16-dev"
            experimental: true
    # Keyed on the matrix, not a bare `true`: the stable rows still fail the
    # summary job below.
    continue-on-error: ${{ matrix.experimental }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        # --group needs pip >= 25.1 to read PEP 735 [dependency-groups]
        run: |
          python -m pip install --upgrade pip
          pip install --group dev -e .
      - name: Run test suite
        # --ignore=tests/benchmarks: they need pytest-codspeed, which
        # codspeed.yml installs and this workflow deliberately does not.
        run: >-
          pytest tests/ -v --ignore=tests/benchmarks
          --cov=exeradar --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        # Once, not once per matrix entry: the same report four times is four
        # uploads of one measurement. 3.12 is in every Radar's matrix.
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          # OIDC, not a CODECOV_TOKEN secret: Codecov files an upload under the
          # project its token belongs to, and this repository's token, copied into
          # three other Radars, took their reports in here (tests/test_codecov_contract.py).
          use_oidc: true
          files: coverage.xml
          # A failed upload loses a metric; it does not invalidate the tests that
          # just passed. What it must not do is stay silent forever — ask Codecov
          # whether the report arrived.
          fail_ci_if_error: false

  summary:
    # The branch ruleset requires one check name that survives matrix changes.
    # The matrix job cannot provide it: its contexts carry the Python version,
    # so they change whenever the matrix does. always(): a skipped required
    # check counts as passed, so this has to run even when the matrix fails,
    # and fail explicitly in that case.
    name: Tests
    needs: [test]
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: All test jobs succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = "success" ] || { echo "::error::A required test job ended with: $result"; exit 1; }
          done
