source = "Docker Scout"
where = "gcc-14 / libstdc++6 14.2.0-19, python slim-trixie base image"
why = """
CVE-2026-95619, an integer overflow in gcc-14, published against the base image \
on 2026-10-02; until 2026-11-02 Snyk reported it too, as \
SNYK-DEBIAN13-GCC14-20386241. Read with `patchradar debian CVE-2026-95619`: open in trixie \
for gcc-12 (12.4.0-5) and gcc-14 (14.2.0-19), no fixed version in any suite, no \
Debian bug recorded. So there is nothing to wait for and nothing to ask for, and \
the tracker page is where evidence goes: \
https://security-tracker.debian.org/tracker/CVE-2026-95619.

What is *not* established, and is worth saying rather than glossing: the \
scanners name the source package `gcc-14`, and Debian's gcc source produces both \
the compiler and `libstdc++6`, the runtime LIEF is built against. A flaw in cc1 needs \
something to compile and nothing in this image compiles anything; a flaw in the \
runtime is a different exposure. Which binary package is installed had been \
asserted and not measured, so `tests/docker/inspect.sh` now prints the gcc and \
libstdc++ packages and the next `docker-build-check` run answers it.

Since 2026-10-08T15:17:29Z Docker Scout has stopped reporting it, which is why \
the gate lists this entry as settled. It is kept, and the reason is not how long \
the silence has lasted: `patchradar debian CVE-2026-95619` on 2026-10-15 still \
reports gcc-14 no-dsa in trixie at 14.2.0-19, with the fix only in sid \
(14.4.0-3). The package named in `where` is still unfixed in trixie and only the \
reporting changed. Deleting a flaw that is demonstrably present because a \
scanner fell silent is the one direction this file must not drift in.
"""
review_by = "2026-12-31"
