source = "Docker Scout"
where = "openssl 3.5.7-1~deb13u3 (libssl3t64), python:3.14-slim-trixie base image"
why = """
A DANE-enabled TLS client may dereference a NULL pointer on an unusual pair of \
certificate and TLSA records (Debian security tracker). No OpenSSL advisory yet; \
the fix is openssl/openssl#33634, open on 2026-11-20 and marked for the 3.5 \
branch. Debian lists trixie and sid as vulnerable, with no fixed version, \
3.5.9-1~deb13u1 included. Docker Scout reports it as high. `apt-get upgrade` \
runs at build time, and the image is rebuilt at every release: the DSA arrives \
here without anyone chasing it, and this entry then fails the build as unused.

It is reached only by a TLS client that enables DANE (SSL_dane_enable) and checks \
TLSA records. Python's ssl module exposes no DANE at all, and exeradar reads no \
TLSA record. exeradar's own TLS is Python's ssl module over TCP (httpx, for the \
law texts); Authenticode is read by LIEF with its own embedded crypto, not the \
image's libssl.
"""
review_by = "2026-12-15"

