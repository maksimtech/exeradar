# Findings that are open, known, and accepted for now — each with a reason and a
# date. `.github/workflows/security-posture.yml` reads this file: an open high or
# critical alert with no entry here fails the build, an entry past its
# `review_by` fails the build, and an entry that no longer matches anything fails
# the build too, so the record cannot drift away from the product.
#
# The rule this file exists to serve: block on everything we can fix, never block
# on an upstream flaw with no fix available — but write down why, and when that
# will be looked at again.
#
# Fields: id, where, why, review_by are required. `source` narrows an entry to one
# scanner; `path` narrows it to one file, which matters for a rule that can fire
# anywhere — an entry for a CodeQL rule without a path would excuse the next real
# occurrence of it somewhere else.
#
# Written on 2026-09-29 against the nine blocking alerts GitHub then held for this
# repository.
#
# Pruned on 2026-10-02. Four entries that had been written as "closes when the
# next image is published" did close: CVE-2025-47273, CVE-2026-57585 and
# GHSA-6v7p-g79w-8964 were copies vendored under `pip/_vendor/`, which the
# Dockerfile now removes with the rest of the build tooling, and CVE-2026-84782
# was openssl, which Debian fixed in 3.5.7-1~deb13u3 and `apt-get upgrade` picked
# up at the rebuild. GitHub closed all four at 2026-09-30T19:26:53Z — one
# timestamp, the republish — and Docker Scout has run six times since without
# mentioning any of them. They are out, and their return would mean the fix
# regressed, which is worth a build failing over.
#
# CVE-2026-82560 is the counter-case and stays, which is in its own entry below.

# ─────────────────────────────────────────────────────────────────────────────
# Debian 13 (trixie) packages of the base image. `apt-get upgrade` runs at build
# time and the image is rebuilt at every release, so a fix Debian ships arrives
# here without anyone chasing it.
#
# Two different cases, which every scanner prints identically as "no fix
# available", read out of the security tracker with `patchradar debian`:
#
#   zlib, perl   open in bookworm, trixie, sid and forky alike, nothing
#                scheduled anywhere. Waiting is not a plan; the Debian bug is
#                where evidence goes.
#   attr, acl    already fixed in unstable, filed no-dsa for trixie *because the
#                fix comes in a point release*. That waiting ends at a dated
#                event: rebuild after it.
#
# attr and acl have no entry since 2026-11-02, and not because they were fixed:
# Snyk was the only scanner reporting them, and Snyk was retired that day
# (tests/test_workflow_set.py, RETIRED). Both are still in the image until the
# trixie point release. If Trivy's image scan reports either, its entry carries
# these facts under Trivy, with the review date they had, 2026-11-30:
#   attr  CVE-2026-54371, Debian bug 1141107, fixed in unstable and forky at
#         1:2.6.0-1; a symlink traversal in recursive getfattr/setfattr.
#   acl   CVE-2026-54369, Debian bug 1141110, fixed in unstable and forky at
#         2.4.0-1, not backported because the fix adds the acl_*_at() ABI; a
#         local TOCTOU in recursive setfacl/chacl.
# exeradar runs none of those programs.
# ─────────────────────────────────────────────────────────────────────────────

[[exception]]
id = "CVE-2026-85091"
source = "Docker Scout"
where = "zlib 1:1.3.dfsg+really1.3.1-1, python:3.14-slim-trixie base image"
why = """
Debian reports no fixed version in any suite — open in bookworm, trixie, sid and \
forky, urgency not yet assigned, Debian bug 1146895. There is nothing to wait \
for and nothing to ask for; what moves a flaw in this state is evidence on that \
bug.

An out-of-bounds write reached through gzprintf. exeradar decompresses nothing: \
it reads executables with LIEF and scans their bytes, and the only zlib in the \
path is Python's own module under httpx, on responses to requests exeradar made.
"""
review_by = "2026-12-31"

[[exception]]
id = "CVE-2026-82560"
source = "Docker Scout"
where = "perl-base, python:3.14-slim-trixie base image"
why = """
Open in all four suites, including sid — Debian bug 1148455, nothing scheduled. \
Scout names the *source* package `perl`, which in Debian produces both the \
removable `perl` and `perl-base`, which is Essential and which dpkg itself \
depends on.

Measured in *this* image on 2026-09-29, by tests/docker/inspect.sh in \
docker-build-check.yml run 36587553929: the only real package is `perl-base` \
5.40.1-6+deb13u1, essential=yes priority=required. `perl`, `perl-modules`, \
`perlapi-5.40.0` and `perlapi-5.40.1` appear in dpkg-query output with no version \
and no priority — they are virtual packages that perl-base provides, not installs \
of their own. The full `perl` is not here, so there is nothing to remove.

So the finding is ours to record and not ours to close. The date is for re-reading \
whether Debian has published a fix, not for trying the removal again.

And since 2026-09-29T15:08:22Z Docker Scout has stopped reporting it, which is why \
the gate lists this entry as settled. It is kept anyway, and the distinction is the \
point: the four entries pruned on 2026-10-02 went quiet because the thing they \
described left the image. This one went quiet on its own. \
`patchradar debian CVE-2026-82560` on 2026-10-02 still reports perl no-dsa in \
trixie at 5.40.1-6+deb13u1, no fix in any suite, Debian bug 1148455 — so perl-base \
is still installed and still unfixed, and only the reporting changed. Scout has \
already changed its mind about this exact id once, which \
`.github/workflows/security-posture.yml` records as the reason the gate reads \
closed alerts at all. Deleting a flaw that is demonstrably present because a \
scanner fell silent is the one direction this file must not drift in.
"""
review_by = "2026-12-31"

# ─────────────────────────────────────────────────────────────────────────────
# CodeQL `py/incomplete-url-substring-sanitization`, one alert. Read before being
# written down.
#
# The rule fires on `"something.tld" in text`, on the assumption that a hostname
# literal tested with `in` is a URL being checked. Here the subject is a list of
# URLs exeradar just extracted from a PE overlay, and the assertion is that a
# known one is among them.
#
# exeradar takes no decision on a hostname at all, which is what makes this a
# misfire rather than a warning: it classifies an extracted string as a URL by
# looking its suffix up in a frozenset of IANA TLDs — strings.py:289,
# `if suffix not in TLDS` — which is a membership test and not a substring test.
# The file extension case the rule would really catch was already handled there
# on purpose; see the comment at strings.py:274.
# ─────────────────────────────────────────────────────────────────────────────

[[exception]]
id = "py/incomplete-url-substring-sanitization"
source = "CodeQL"
path = "tests/test_overlay.py"
where = "test_overlay.py:89 — asserting a URL survives the overlay scan"
why = """
`assert any("schemas.microsoft.com" in url for url in result.strings.urls)`. The \
test proves that a scan which keeps the overlay also keeps the strings inside \
it — the pair to the test above it, which would otherwise pass while dropping \
the image. The subject is data exeradar extracted in the same test, and nothing \
is sanitized.
"""
review_by = "2026-12-31"


# ─────────────────────────────────────────────────────────────────────────────
# gcc. CVE-2026-102010 arrived on 2026-09-30, published overnight against the
# base image; exeradar was not released that day, so the gate refused the next
# push to main instead — which is the gate working. CVE-2026-95619 followed on
# 2026-10-02. The openssl finding that arrived with the first, CVE-2026-84782,
# was never an acceptance but a rebuild, and the rebuild happened: removed on
# 2026-10-02.
#
# Until 2026-11-02 each flaw had two entries, because Snyk named them
# SNYK-DEBIAN13-GCC14-20335537 and SNYK-DEBIAN13-GCC14-20386241 and this file
# matches by id. Snyk was retired that day; its entries left, and their reasons
# live on in the Docker Scout entries below.
#
# Both positions read with `patchradar debian`, not from the scanners' one line:
# open in trixie for gcc-12 (12.4.0-5) and gcc-14 (14.2.0-19), no fixed version
# in any suite, no Debian bug recorded. Nothing to wait for and nothing to ask
# for; what moves a flaw in this state is evidence on the tracker page.
# ─────────────────────────────────────────────────────────────────────────────

[[exception]]
id = "CVE-2026-102010"
source = "Docker Scout"
where = "gcc-14 / libstdc++6 14.2.0-19, python slim-trixie base image"
why = """
Open in trixie for gcc-12 (12.4.0-5) and gcc-14 (14.2.0-19) with no fixed version \
in any suite and no Debian bug — checked with \
`patchradar debian CVE-2026-102010`. There is nothing to wait for and nothing to \
ask for; what moves it is evidence on \
https://security-tracker.debian.org/tracker/CVE-2026-102010.

Nor is it removable here, and less so than anywhere else among the Radar. The \
scanners name the source package `gcc-14`; what is installed is `libstdc++6`, the \
C++ runtime — and exeradar's own parser is LIEF, a C++ library. Removing it would \
leave an image that cannot read a PE file. Recorded from 2026-09-30 under Snyk's \
id SNYK-DEBIAN13-GCC14-20335537 too, until Snyk was retired on 2026-11-02.

Since 2026-10-07T20:07:31Z Docker Scout has stopped reporting it, which is why \
the gate lists this entry as settled. It is kept, and the reason is not how long \
the silence has lasted: `patchradar debian CVE-2026-102010` on 2026-10-15 still \
reports gcc-14 no-dsa in trixie at 14.2.0-19, with the fix only in sid \
(14.4.0-3). The package named in `where` is still unfixed in trixie and only the \
reporting changed. Deleting a flaw that is demonstrably present because a \
scanner fell silent is the one direction this file must not drift in.
"""
review_by = "2026-12-31"

[[exception]]
