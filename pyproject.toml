[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "exeradar"
dynamic = ["version"]
description = "Static analysis of Windows, macOS and Linux executables — PE headers, imports, strings, code signing"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
authors = [
    {name = "Massimo Moretti", email = "massimo.moretti@maksimtech.com"}
]
keywords = ["pe", "executable", "authenticode", "code-signing", "static-analysis"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
]
dependencies = [
    # 1.0.0 covers PE, ELF and Mach-O behind one API and ships an abi3 wheel,
    # so it installs on 3.14 without a build. See ARCHITECTURE.md section 2.
    "lief>=1.0.0",
    # One job only: decoding the RFC3161 TSTInfo that LIEF exposes but does not
    # parse, which is where the countersignature date lives. signify was the
    # obvious choice and depends on oscrypto, unmaintained since 2022 and
    # broken against OpenSSL 3.x; asn1crypto is pure Python and enough.
    "asn1crypto>=1.5.1",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "httpx>=0.27.0",
]

[project.urls]
Homepage = "https://github.com/maksimtech/exeradar"
Issues = "https://github.com/maksimtech/exeradar/issues"

[project.scripts]
exeradar = "exeradar.cli:app"

[tool.hatch.version]
path = "exeradar/__init__.py"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.16",
    "mypy>=1.18",
    "hypothesis>=6.140",
    "mutmut>=3.8",
    "pytest-codspeed>=4.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["exeradar"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# Useful without being noisy. The security ruleset S is deliberately absent:
# ruff's S rules *are* flake8-bandit — measured on 2026-09-24, S110 and B110
# reported the same four try-except-pass — so selecting it here would report
# every finding twice, under two ids, in two places to be archived.
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# B008 objects to a function call in an argument default, and Typer's entire
# API is exactly that: `def cmd(x: str = typer.Option(...))`. There is no fix
# on this side — moving the call into the body would stop Typer seeing the
# option at all — so the two calls are declared immutable instead.
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.ruff.lint.per-file-ignores]
# A test may import for a side effect, or redefine a fixture name to make the
# case read; neither is a defect there.
"tests/*" = ["F811", "E402"]

[tool.mypy]
python_version = "3.11"
# Not strict mode. lief, typer, rich and httpx all ship py.typed, but
# asn1crypto does not, and strict would spend its errors on the untyped edge
# rather than on this code — an error that cannot be acted on teaches the
# reader to ignore the tool. The permissive run still found real defects.
ignore_missing_imports = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
# Tests assert against deliberately malformed input; annotating that would
# describe the fixtures rather than check the code.
module = "tests.*"
ignore_errors = true

[tool.mutmut]
source_paths = ["exeradar"]
pytest_add_cli_args_test_selection = ["tests/"]
# mutmut 3.8 refuses to run on Windows and points at WSL, so this is a CI-only
# configuration: the scheduled workflow runs it on ubuntu.
do_not_mutate = ["exeradar/__init__.py"]
