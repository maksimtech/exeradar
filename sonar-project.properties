sonar.projectKey=maksimtech_exeradar
sonar.organization=maksimtech
sonar.projectName=ExeRadar

# No sonar.projectVersion: written here it drifts from the package's own and
# nothing notices — apkradar's says 2026.09.1 against a package at 2026.09.32.
sonar.python.version=3.11, 3.12, 3.13, 3.14

sonar.sources=exeradar
sonar.tests=tests
sonar.test.inclusions=tests/**/*

# The fixtures are not code this project wrote. tests/fixtures holds excerpts of
# the CRA, GDPR and NIS2 downloaded from EUR-Lex, kept so the citations can be
# verified offline, plus python.exe under the PSF licence as the signed-binary
# sample. Analysed, they produced the two findings that broke the quality gate on
# 2026-09-25: a saved regulation was told off for having no <!DOCTYPE>, no `lang`
# attribute and no <th> in its tables.
sonar.exclusions=**/__pycache__/**,**/*.pyc,tests/fixtures/**
sonar.test.exclusions=tests/fixtures/**

# The workflows stay in. A missing `--only-binary :all:` and actions pinned by
# tag rather than by SHA are statements about this repository's own supply chain:
# they deserve a decision in SonarCloud, not an exclusion here that makes them
# disappear.

# Written by the Sonar workflow's own run:
#   pytest tests/ --cov --cov-report=xml:coverage.xml
sonar.python.coverage.reportPaths=coverage.xml

sonar.links.homepage=https://github.com/maksimtech/exeradar
sonar.links.ci=https://github.com/maksimtech/exeradar/actions
sonar.links.issue=https://github.com/maksimtech/exeradar/issues
sonar.links.scm=https://github.com/maksimtech/exeradar
